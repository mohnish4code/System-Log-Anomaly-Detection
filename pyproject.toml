[project]
name = "system-log-anomaly-detection"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "frontend", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
